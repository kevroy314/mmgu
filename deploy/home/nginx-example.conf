# Example: Hallkeeper behind nginx + oauth2-proxy ("header" auth mode).
# oauth2-proxy signs people in (Google, GitHub, ...) and passes their email; nginx adds the
# shared secret so the hall trusts the email header only when it came through here.
#
# Hallkeeper .env for this setup:
#   MMGU_AUTH_MODES=header
#   MMGU_PROXY_SECRET=<same long random value as below>
#   MMGU_BOOTSTRAP_LEADERS=email:<your sign-in email>
#   MMGU_BASE_URL=https://guild.example.com
server {
    listen 443 ssl;
    server_name guild.example.com;

    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location @oauth2_signin { return 302 /oauth2/start?rd=$scheme://$host$request_uri; }

    # Stream overlays are opened by OBS, which can't sign in. They authorise by their own secret token.
    location /overlay/ {
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Email "";
        proxy_buffering off;              # server-sent events
        proxy_read_timeout 86400;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_set_header X-Email $auth_email;
        proxy_set_header X-MMGU-Proxy-Secret "<long random value>";
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16m;
    }
}
