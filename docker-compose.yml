# Hallkeeper on one machine.
#
#   cp .env.example .env        # then fill it in
#   docker compose up -d                          # the hall (web + Discord bot)
#   docker compose --profile ai up -d             # + local AI for reading screenshots (NVIDIA GPU)
#   docker compose --profile share up -d          # + Tailscale Funnel public URL
#   docker compose --profile backup up -d         # + continuous database backup (Litestream)
#
# Profiles combine: docker compose --profile ai --profile share up -d

name: mmgu

services:
  hallkeeper:
    build: .
    image: hallkeeper:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MMGU_DATA_DIR: /data
      MMGU_OLLAMA_URL: ${MMGU_OLLAMA_URL:-http://ollama:11434}
    volumes:
      - ./data:/data
    ports:
      - "${MMGU_BIND:-127.0.0.1}:${MMGU_HOST_PORT:-8420}:8420"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Pull the vision model once: docker compose --profile ai run --rm ollama-pull
  ollama-pull:
    profiles: ["ai-setup"]
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=ollama:11434 ollama pull ${MMGU_OLLAMA_MODEL:-qwen3-vl:8b}"]
    depends_on: [ollama]

  tailscale:
    profiles: ["share"]
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-hallkeeper}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro

  litestream:
    profiles: ["backup"]
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - ./data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro

volumes:
  ollama:
  tailscale:
