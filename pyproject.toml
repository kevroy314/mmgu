[project]
name = "mmgu"
version = "0.1.0"
description = "Hallkeeper: a self-hosted guild hall (Discord bot + web app) for Monsters & Memories and other EverQuest-style MMOs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "discord.py>=2.4",
    "pillow>=10.3",
    "sse-starlette>=2.1",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
mmgu = "mmgu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmgu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"src/mmgu/core/icons.py" = ["E501"]
