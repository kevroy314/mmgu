{% extends "core/base.html" %}
{% block title %}Welcome{% endblock %}
{% block content %}
<div class="gate">
  <div class="card" style="text-align:left;align-items:stretch">
    <p class="eyebrow">First time in the hall</p>
    <h1>What should the guild call you?</h1>
    <p class="muted">This is the name other members see. Use your main character's name or whatever you go by in the guild. You can change it later.</p>
    <form class="stack" method="post" action="/welcome">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field"><label for="display_name">Name</label>
        <input id="display_name" name="display_name" type="text" minlength="2" maxlength="60" required autofocus
               value="{{ '' if viewer.name.startswith('Adventurer ') else viewer.name }}"></div>
      <button class="btn primary">Enter the hall</button>
    </form>
  </div>
</div>
{% endblock %}
